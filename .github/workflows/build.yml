name: Build ClearLink

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
permissions:
  contents: write

concurrency:
  group: clearlink-build
  cancel-in-progress: true

jobs:

  # ============================================================
  # Linux AMD64
  # ============================================================

  linux-amd64:
    name: Linux AMD64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopus-dev \
            libopusfile-dev \
            librtlsdr-dev \
            libgpiod-dev \
            pkg-config

      - name: Build
        env:
          CLEARLINK_VERSION: ${{ github.sha }}
        run: |
          mkdir -p output

          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/broadcast \
            ./cmd/broadcast

          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/listen \
            ./cmd/listen

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/server \
            ./cmd/server

          sha256sum output/* > output/SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: clearlink-linux-amd64
          path: output/


  # ============================================================
  # Linux ARM64
  # ============================================================

  linux-arm64:
    name: Linux ARM64 / Raspberry Pi
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopus-dev \
            libopusfile-dev \
            librtlsdr-dev \
            libgpiod-dev \
            pkg-config

      - name: Build
        env:
          CLEARLINK_VERSION: ${{ github.sha }}
        run: |
          mkdir -p output

          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/broadcast \
            ./cmd/broadcast

          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/listen \
            ./cmd/listen

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X version.Version=${CLEARLINK_VERSION}" \
            -o output/server \
            ./cmd/server

          sha256sum output/* > output/SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: clearlink-linux-arm64
          path: output/


  # ============================================================
  # Windows AMD64
  # ============================================================

  windows-amd64:
    name: Windows AMD64
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: true

      - name: Build
        shell: pwsh
        env:
          CLEARLINK_VERSION: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null

          $env:CGO_ENABLED = "0"

          go build `
            -trimpath `
            "-ldflags=-s -w -X version.Version=$env:CLEARLINK_VERSION" `
            -o output/server.exe `
            ./cmd/server

          $hash = (Get-FileHash output/server.exe -Algorithm SHA256).Hash.ToLower()

          "$hash  server.exe" |
            Out-File -Encoding ascii output/SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: clearlink-windows-amd64
          path: output/


  # ============================================================
  # Publish
  # ============================================================

  publish:
    name: Publish build
    needs:
      - linux-amd64
      - linux-arm64
      - windows-amd64

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Linux AMD64
        uses: actions/download-artifact@v5
        with:
          name: clearlink-linux-amd64
          path: /tmp/clearlink/linux-amd64

      - name: Download Linux ARM64
        uses: actions/download-artifact@v5
        with:
          name: clearlink-linux-arm64
          path: /tmp/clearlink/linux-arm64

      - name: Download Windows AMD64
        uses: actions/download-artifact@v5
        with:
          name: clearlink-windows-amd64
          path: /tmp/clearlink/windows-amd64

      - name: Show downloaded artifacts
        run: |
          echo "=== Linux AMD64 ==="
          find /tmp/clearlink/linux-amd64 -type f -print

          echo "=== Linux ARM64 ==="
          find /tmp/clearlink/linux-arm64 -type f -print

          echo "=== Windows AMD64 ==="
          find /tmp/clearlink/windows-amd64 -type f -print

      - name: Switch to builds branch
        run: |
          git fetch origin builds
          git checkout -B builds origin/builds

      - name: Publish build
        env:
          SHA: ${{ github.sha }}
        run: |
          set -e

          echo "Publishing build:"
          echo "$SHA"

          mkdir -p "$SHA"

          mkdir -p "$SHA/linux-amd64"
          mkdir -p "$SHA/linux-arm64"
          mkdir -p "$SHA/windows-amd64"

          cp -r /tmp/clearlink/linux-amd64/. \
            "$SHA/linux-amd64/"

          cp -r /tmp/clearlink/linux-arm64/. \
            "$SHA/linux-arm64/"

          cp -r /tmp/clearlink/windows-amd64/. \
            "$SHA/windows-amd64/"

          cat > latest.json <<EOF
          {
            "version": "$SHA",
            "commit": "$SHA",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-amd64": "$SHA/linux-amd64",
              "linux-arm64": "$SHA/linux-arm64",
              "windows-amd64": "$SHA/windows-amd64"
            }
          }
          EOF

          echo "=== Files being published ==="
          find "$SHA" -type f -print
          echo
          cat latest.json

          git add "$SHA" latest.json

          git commit \
            -m "Build $SHA"

          git push origin builds